name: Henneth CI contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Python syntax
        run: python -m compileall -q scripts

      - name: Set CI build cutoff
        run: echo "HENNETH_CI_BUILD_CUTOFF_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          patterns = (
              "*.js",
              "api/*.js",
              "dashboard/*.js",
              "Henneth Desk 2.CI.0/*.js",
              "Henneth Desk 2.CI.0/api/*.js",
          )

          files = []
          seen = set()
          for pattern in patterns:
              for path in sorted(Path().glob(pattern)):
                  if path.is_file() and path not in seen:
                      files.append(path)
                      seen.add(path)

          if not files:
              raise SystemExit("No JavaScript files matched the CI contract.")

          for path in files:
              print(f"node -c {path.as_posix()}")
              subprocess.run(["node", "-c", str(path)], check=True)
          PY

      - name: Build generated Company Intelligence artifacts
        run: |
          python scripts/build_financial_model_inputs.py
          python scripts/build_financial_coverage.py
          python scripts/build_forecast_readiness.py
          python scripts/build_financial_evidence_reconciliation.py
          python scripts/build_financial_truth_qualification.py
          python scripts/build_formal_financial_engines.py
          python scripts/build_operating_events.py
          python scripts/build_driver_graphs.py
          python scripts/impact_engine.py
          python scripts/build_signal_clusters.py
          python scripts/build_event_studies.py
          python scripts/build_conditional_benchmarks.py
          python scripts/build_causal_foundations.py
          python scripts/build_thesis_monitoring.py
          python scripts/build_intelligence_confidence.py
          python scripts/build_guidance_contradictions.py
          python scripts/build_management_delivery.py
          python scripts/build_evidence_watchlist.py
          python scripts/build_ci_monitoring.py
          python scripts/build_peer_registry.py
          python scripts/build_company_scenario_lab.py
          python scripts/build_ownership_source_manifest.py
          python scripts/build_ci_reprocess_manifest.py
          python scripts/build_company_brains.py
          python scripts/build_ci_completion_matrix.py
          python scripts/build_ci_slice.py
          python scripts/build_ci_artifact_integrity.py

      - name: Verify finalized artifacts match this commit
        run: python scripts/check_ci_artifact_integrity.py

      - name: Company Intelligence product contract aggregate
        run: python scripts/check_ci_product_contracts.py

      - name: Preflight gate
        run: python scripts/preflight.py
